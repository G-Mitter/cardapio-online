# CI = Integração Contínua.
# A cada push ou Pull Request, o GitHub sobe uma máquina limpa, instala o projeto
# e roda as verificações abaixo. Se algo quebrar, o PR fica vermelho antes do merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Um banco Postgres temporário só para os testes desta execução
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cardapio
      PAYLOAD_SECRET: ci-secret-only-for-tests

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint (padrões de código)
        run: pnpm lint

      - name: Typecheck (erros de tipo do TypeScript)
        run: pnpm typecheck

      - name: Testes de integração
        run: pnpm test:int

      - name: Build de produção
        run: pnpm build
